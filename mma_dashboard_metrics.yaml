# Metrics used by the MMA Enriched Dashboard (mma_enriched.json)
# Total: 88 unique metrics
# Generated from docs/generated/metrics/metrics.yaml

# =============================================================================
# SQL Metrics
# =============================================================================

- name: sql.service.latency
  exported_name: sql_service_latency
  description: Latency of SQL request execution
  y_axis_label: Latency
  type: HISTOGRAM
  unit: NANOSECONDS
  aggregation: AVG
  derivative: NONE
  how_to_use: These high-level metrics reflect workload performance. Monitor these metrics to understand latency over time. If abnormal patterns emerge, apply the metric's time range to the SQL Activity pages to investigate interesting outliers or patterns. The Statements page has P90 Latency and P99 latency columns to enable correlation with this metric.
  visibility: ESSENTIAL

- name: sql.query.count
  exported_name: sql_query_count
  description: Number of SQL operations started including queries, and transaction control statements
  y_axis_label: SQL Statements
  type: COUNTER
  unit: COUNT
  aggregation: AVG
  derivative: NON_NEGATIVE_DERIVATIVE
  visibility: SUPPORT

# =============================================================================
# System CPU Metrics
# =============================================================================

- name: sys.cpu.combined.percent-normalized
  exported_name: sys_cpu_combined_percent_normalized
  description: Current user+system cpu percentage consumed by the CRDB process, normalized 0-1 by number of cores
  y_axis_label: CPU Time
  type: GAUGE
  unit: PERCENT
  aggregation: AVG
  derivative: NONE
  how_to_use: "This metric gives the CPU utilization percentage by the CockroachDB process. If it is equal to 1 (or 100%), then the CPU is overloaded. The CockroachDB process should not be running with over 80% utilization for extended periods of time (hours). This metric is used in the DB Console CPU Percent graph."
  visibility: ESSENTIAL

- name: sys.cpu.sys.percent
  exported_name: sys_cpu_sys_percent
  description: Current system cpu percentage consumed by the CRDB process
  y_axis_label: CPU Time
  type: GAUGE
  unit: PERCENT
  aggregation: AVG
  derivative: NONE
  how_to_use: "This metric gives the CPU usage percentage at the system (Linux kernel) level by the CockroachDB process only. This is similar to the Linux top command output. The metric value can be more than 1 (or 100%) on multi-core systems. It is best to combine user and system metrics."
  visibility: ESSENTIAL

- name: sys.cpu.user.percent
  exported_name: sys_cpu_user_percent
  description: Current user cpu percentage consumed by the CRDB process
  y_axis_label: CPU Time
  type: GAUGE
  unit: PERCENT
  aggregation: AVG
  derivative: NONE
  how_to_use: "This metric gives the CPU usage percentage at the user level by the CockroachDB process only. This is similar to the Linux top command output. The metric value can be more than 1 (or 100%) on multi-core systems. It is best to combine user and system metrics."
  visibility: ESSENTIAL

- name: sys.cpu.sys.ns
  exported_name: sys_cpu_sys_ns
  description: Total system cpu time consumed by the CRDB process
  y_axis_label: CPU Time
  type: COUNTER
  unit: NANOSECONDS
  aggregation: AVG
  derivative: NON_NEGATIVE_DERIVATIVE
  visibility: SUPPORT

- name: sys.cpu.user.ns
  exported_name: sys_cpu_user_ns
  description: Total user cpu time consumed by the CRDB process
  y_axis_label: CPU Time
  type: COUNTER
  unit: NANOSECONDS
  aggregation: AVG
  derivative: NON_NEGATIVE_DERIVATIVE
  visibility: SUPPORT

- name: sys.rss
  exported_name: sys_rss
  description: Current process RSS
  y_axis_label: RSS
  type: GAUGE
  unit: BYTES
  aggregation: AVG
  derivative: NONE
  how_to_use: "This metric gives the amount of RAM used by the CockroachDB process. Persistently low values over an extended period of time suggest there is underutilized memory that can be put to work with adjusted settings for --cache or --max_sql_memory or both. Conversely, a high utilization, even if a temporary spike, indicates an increased risk of Out-of-memory (OOM) crash (particularly since the swap is generally disabled)."
  visibility: ESSENTIAL

# =============================================================================
# System Disk I/O Metrics
# =============================================================================

- name: sys.host.disk.iopsinprogress
  exported_name: sys_host_disk_iopsinprogress
  description: IO operations currently in progress on this host (as reported by the OS)
  y_axis_label: Operations
  type: GAUGE
  unit: COUNT
  aggregation: AVG
  derivative: NONE
  how_to_use: This metric gives the average queue length of the storage device. It characterizes the storage device's performance capability. Values over 10 are bad. Values around 5 mean the device is working hard trying to keep up.
  visibility: ESSENTIAL

- name: sys.host.disk.read.bytes
  exported_name: sys_host_disk_read_bytes
  description: Bytes read from all disks since this process started (as reported by the OS)
  y_axis_label: Bytes
  type: COUNTER
  unit: BYTES
  aggregation: AVG
  derivative: NON_NEGATIVE_DERIVATIVE
  how_to_use: This metric reports the effective storage device read throughput (MB/s) rate.
  visibility: ESSENTIAL

- name: sys.host.disk.read.count
  exported_name: sys_host_disk_read_count
  description: Disk read operations across all disks since this process started (as reported by the OS)
  y_axis_label: Operations
  type: COUNTER
  unit: COUNT
  aggregation: AVG
  derivative: NON_NEGATIVE_DERIVATIVE
  how_to_use: This metric reports the effective storage device read IOPS rate.
  visibility: ESSENTIAL

- name: sys.host.disk.write.bytes
  exported_name: sys_host_disk_write_bytes
  description: Bytes written to all disks since this process started (as reported by the OS)
  y_axis_label: Bytes
  type: COUNTER
  unit: BYTES
  aggregation: AVG
  derivative: NON_NEGATIVE_DERIVATIVE
  how_to_use: This metric reports the effective storage device write throughput (MB/s) rate.
  visibility: ESSENTIAL

- name: sys.host.disk.write.count
  exported_name: sys_host_disk_write_count
  description: Disk write operations across all disks since this process started (as reported by the OS)
  y_axis_label: Operations
  type: COUNTER
  unit: COUNT
  aggregation: AVG
  derivative: NON_NEGATIVE_DERIVATIVE
  how_to_use: This metric reports the effective storage device write IOPS rate.
  visibility: ESSENTIAL

- name: sys.host.disk.write.time
  exported_name: sys_host_disk_write_time
  description: Time spent writing to all disks since this process started (as reported by the OS)
  y_axis_label: Time
  type: COUNTER
  unit: NANOSECONDS
  aggregation: AVG
  derivative: NON_NEGATIVE_DERIVATIVE

